<!doctype html>
<html lang="en" data-vds-schema="v3.1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VDS v3.1 artifact starter</title>
  <style>
    :root { --canvas-w: 1440px; --canvas-h: 2560px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: var(--canvas-w); height: var(--canvas-h); overflow: hidden; }
    .artifact { position: relative; width: 100%; height: 100%; }
    [data-hidden="true"] { visibility: hidden; }
  </style>
</head>
<body>
  <main class="artifact" data-vds-layer="field" data-vds-action="subject-field">
    <div data-vds-role="atmosphere" data-vds-layer="field" data-vds-action="field-treatment"></div>
    <div data-vds-role="evidence" data-vds-layer="event" data-vds-action="decisive-event"></div>
    <h1 data-vds-role="title" data-vds-action="display-type">TITLE</h1>
    <p data-vds-role="explanation" data-vds-layer="inscription" data-vds-action="information-choreography">Approved or sourced copy.</p>
    <div data-vds-layer="material" data-vds-cause="Describe the subject or carrier cause"></div>
  </main>
  <script>
    const view = new URLSearchParams(location.search).get("view") || "full";
    if (view === "copy-hidden") document.querySelectorAll('[data-vds-role="title"],[data-vds-role="explanation"]').forEach(el => el.dataset.hidden = "true");
    if (view === "image-hidden") document.querySelectorAll('[data-vds-role="atmosphere"],[data-vds-role="evidence"]').forEach(el => el.dataset.hidden = "true");
    document.body.dataset.view = view;
  </script>
</body>
</html>
